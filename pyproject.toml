[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patcheval-inspect"
version = "0.1.0"
description = "Inspect AI evaluation package for the PatchEval verified Dockerized vulnerability repair subset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "PatchEval Authors" }
]
dependencies = [
  "inspect_ai>=0.3.245",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/patcheval_inspect"]

[tool.hatch.build.targets.wheel.force-include]
"src/patcheval_inspect/data/patcheval_verified.json" = "patcheval_inspect/data/patcheval_verified.json"
"src/patcheval_inspect/task_template/compose.yml" = "patcheval_inspect/task_template/compose.yml"
